<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111214"><title>Equipe | Distrito 21</title><link rel="manifest" href="staff.webmanifest"><link rel="icon" href="icon-192.png"><style>
:root{--bg:#f4f5f6;--card:#fff;--text:#111214;--muted:#70757b;--line:#dfe2e5;--orange:#f36a21;--red:#be3d20;--green:#257a3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input,textarea{font:inherit}.wrap{max-width:720px;margin:auto;padding:16px 14px 90px}.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.top img{width:54px;height:54px;border-radius:16px}.top h1{margin:0;font-size:24px}.top p{margin:2px 0 0;color:var(--muted);font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px}.btn{border:0;border-radius:13px;padding:11px 12px;background:#111214;color:#fff;font-weight:850;min-height:44px;text-decoration:none;text-align:center}.orange{background:var(--orange)}.red{background:var(--red)}.green{background:var(--green)}.soft{background:#eef0f2;color:#111}.sm{font-size:12px;min-height:38px;padding:9px}.appt{border:1px solid var(--line);border-radius:17px;padding:13px;margin:9px 0;background:#fff}.apptHead{display:flex;justify-content:space-between;gap:12px}.time{font-weight:950;font-size:22px;color:var(--orange)}.muted{color:var(--muted);font-size:12px;line-height:1.5}.name{font-weight:900;font-size:16px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffffff4;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px;display:flex;justify-content:center;gap:8px}.tab{border:0;border-radius:13px;background:#eef0f2;padding:10px 18px;font-weight:850}.tab.on{background:#111214;color:#fff}.hidden{display:none!important}.login{max-width:420px;margin:14vh auto 0;text-align:center}.login img{width:92px;height:92px;border-radius:24px}.login input,.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:16px;margin-top:8px}.notice{background:#fff1e9;border:1px solid #ffd0b8;color:#7d3410;padding:11px;border-radius:13px;font-size:12px;line-height:1.5}.client{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.modalBack{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:30}.modal{background:#fff;border-radius:24px 24px 0 0;width:min(100%,720px);padding:18px 16px 24px;max-height:92vh;overflow:auto}.photoPreview{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:#eee;margin-top:10px}.modal label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-top:10px}.empty{text-align:center;color:var(--muted);padding:28px 10px}.status{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted)}@media(max-width:420px){.actions{grid-template-columns:1fr 1fr}.actions .finish{grid-column:1/-1}}</style></head><body><main class="wrap"><section id="login" class="login"><img src="icon-512.png" alt="Distrito 21"><h1>Área da equipe</h1><p class="muted">Digite a chave da equipe apenas uma vez neste aparelho.</p><input id="tokenInput" type="password" autocomplete="off" placeholder="Chave da equipe"><button id="loginBtn" class="btn orange" style="width:100%;margin-top:10px">Entrar</button><p id="loginMsg" class="muted"></p></section><section id="app" class="hidden"><header class="top"><img src="icon-512.png" alt="Distrito 21"><div><h1>Distrito 21</h1><p>Agenda compartilhada da equipe</p></div></header><div class="notice">Ao finalizar, tire a foto do corte e envie ao cliente o link privado “Meu último corte”.</div><section id="agendaView"><div class="card"><div class="toolbar"><input id="date" type="date"><button id="todayBtn" class="btn soft sm">Hoje</button></div></div><div id="agenda"></div></section><section id="clientsView" class="hidden"><div class="card"><h2 style="margin:0 0 10px">Clientes</h2><div id="clients"></div></div></section></section></main><nav id="tabs" class="tabs hidden"><button class="tab on" data-tab="agenda">Agenda</button><button class="tab" data-tab="clients">Clientes</button></nav><div id="modal" class="modalBack hidden"><div class="modal"><h2 style="margin-top:0">Finalizar corte</h2><p id="modalClient" class="muted"></p><label>Foto do corte</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="photoPreview hidden" alt="Prévia"><label>Observações (opcional)</label><textarea id="notes" placeholder="Ex.: degradê baixo, máquina 0.5..."></textarea><button id="finishBtn" class="btn orange" style="width:100%;margin-top:12px">Finalizar atendimento</button><button id="closeModal" class="btn soft" style="width:100%;margin-top:8px">Cancelar</button><div id="finishMsg" class="muted" style="margin-top:10px"></div></div></div><script>
const API='https://mxrnwyxfvlxdoeksqmph.supabase.co/functions/v1/staff-api';const $=id=>document.getElementById(id);let token=localStorage.getItem('d21_staff_token')||'',currentAppt=null,photoData='';const esc=s=>String(s??'').replace(/[&<>']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[c]));
async function api(action,opts={}){const r=await fetch(API+'?action='+action+(opts.q?'&'+opts.q:''),{method:opts.method||'GET',headers:{'Content-Type':'application/json','x-staff-token':token},body:opts.body?JSON.stringify(opts.body):undefined});const d=await r.json().catch(()=>({}));if(r.status===401)throw Object.assign(new Error('UNAUTHORIZED'),{status:401});if(!r.ok)throw new Error(d.error||'Erro');return d}function localDate(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
async function login(){token=$('tokenInput').value.trim()||token;if(!token)return;try{await api('agenda',{q:'date='+localDate()});localStorage.setItem('d21_staff_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('tabs').classList.remove('hidden');$('date').value=localDate();loadAgenda()}catch{$('loginMsg').textContent='Chave inválida.'}}$('loginBtn').onclick=login;if(token)login();$('todayBtn').onclick=()=>{$('date').value=localDate();loadAgenda()};$('date').onchange=loadAgenda;function time(iso){return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}function dateFmt(iso){return iso?new Date(iso).toLocaleDateString('pt-BR'):'Nunca'}
async function loadAgenda(){const d=$('date').value||localDate();$('agenda').innerHTML='<div class="empty">Carregando...</div>';try{const r=await api('agenda',{q:'date='+d});$('agenda').innerHTML=r.appointments.length?r.appointments.map(a=>{const c=a.clients||{},p=a.professionals||{},s=a.services||{};const payload=encodeURIComponent(JSON.stringify({id:a.id,name:c.name,phone:c.phone}));return `<article class="appt"><div class="apptHead"><div><div class="time">${time(a.starts_at)}</div><div class="name">${esc(c.name)}</div><div class="muted">${esc(s.name)} · ${esc(p.name)}<br>${esc(c.phone)}</div></div><div class="status">${esc(a.status)}</div></div><div class="actions"><button class="btn green sm" onclick="setStatus('${a.id}','confirm')">Confirmar</button><button class="btn red sm" onclick="setStatus('${a.id}','cancel')">Cancelar</button><button class="btn orange sm finish" onclick="openFinish('${payload}')">Finalizar + foto</button></div></article>`}).join(''):'<div class="empty">Nenhum atendimento neste dia.</div>'}catch{$('agenda').innerHTML='<div class="empty">Erro ao carregar a agenda.</div>'}}window.setStatus=async(id,action)=>{if(action==='cancel'&&!confirm('Cancelar este horário?'))return;await api(action,{method:'POST',body:{appointment_id:id}});loadAgenda()};window.openFinish=p=>{currentAppt=JSON.parse(decodeURIComponent(p));$('modalClient').textContent=currentAppt.name+' · '+currentAppt.phone;$('photo').value='';$('notes').value='';$('preview').classList.add('hidden');$('finishMsg').textContent='';photoData='';$('modal').classList.remove('hidden')};$('closeModal').onclick=()=>$('modal').classList.add('hidden');
$('photo').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;photoData=await resize(f);$('preview').src=photoData;$('preview').classList.remove('hidden')};function resize(file){return new Promise((res,rej)=>{const img=new Image(),r=new FileReader();r.onload=()=>img.src=r.result;img.onload=()=>{let w=img.width,h=img.height,max=1600;if(Math.max(w,h)>max){const q=max/Math.max(w,h);w=Math.round(w*q);h=Math.round(h*q)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};r.onerror=rej;r.readAsDataURL(file)})}
$('finishBtn').onclick=async()=>{if(!currentAppt)return;const b=$('finishBtn');b.disabled=true;$('finishMsg').textContent='Salvando...';try{const r=await api('complete',{method:'POST',body:{appointment_id:currentAppt.id,photo_data_url:photoData,notes:$('notes').value}});const link=new URL('ultimo-corte.html',location.href);link.searchParams.set('token',r.client.public_token);const msg=`Olá ${r.client.name}! Seu corte na Distrito 21 foi finalizado ✂️\nVeja seu último corte aqui: ${link.href}`;$('finishMsg').innerHTML=`Atendimento salvo. <a href="https://wa.me/${r.client.phone}?text=${encodeURIComponent(msg)}">Enviar no WhatsApp</a>`;loadAgenda()}catch{$('finishMsg').textContent='Erro ao finalizar.'}finally{b.disabled=false}};
async function loadClients(){$('clients').innerHTML='<div class="empty">Carregando...</div>';try{const r=await api('clients');$('clients').innerHTML=r.clients.length?r.clients.map(c=>{const link=new URL('ultimo-corte.html',location.href);link.searchParams.set('token',c.public_token);const msg=`Olá ${c.name}! Passando para lembrar da Distrito 21 ✂️\nSeu histórico: ${link.href}`;return `<div class="client"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.phone)} · último corte: ${dateFmt(c.last_visit_at)}</div></div><a class="btn orange sm" href="https://wa.me/${esc(c.phone)}?text=${encodeURIComponent(msg)}">WhatsApp</a></div>`}).join(''):'<div class="empty">Nenhum cliente ainda.</div>'}catch{$('clients').innerHTML='<div class="empty">Erro ao carregar clientes.</div>'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');const t=b.dataset.tab;$('agendaView').classList.toggle('hidden',t!=='agenda');$('clientsView').classList.toggle('hidden',t!=='clients');if(t==='clients')loadClients()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
