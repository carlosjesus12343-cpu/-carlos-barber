<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f36a21"><title>Meu último corte | Distrito 21</title><link rel="icon" href="icon-192.png"><style>*{box-sizing:border-box}body{margin:0;background:#f2f3f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111214}.wrap{max-width:560px;margin:auto;padding:24px 14px}.hero{text-align:center}.logo{width:86px;height:86px;border-radius:22px}.card{background:#fff;border:1px solid #dfe2e5;border-radius:22px;padding:16px;margin-top:15px;box-shadow:0 12px 30px #0000000c}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:17px;background:#e7e9eb}.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.box{background:#f1f2f3;border-radius:14px;padding:12px}.box small{display:block;color:#70757b;margin-bottom:5px}.btn{display:block;text-align:center;text-decoration:none;background:#f36a21;color:#fff;border-radius:15px;padding:14px;font-weight:900;margin-top:14px}.muted{color:#70757b;line-height:1.6;text-align:center}.hidden{display:none}</style></head><body><main class="wrap"><header class="hero"><img src="icon-512.png" class="logo" alt="Distrito 21"><h1>Meu último corte</h1><p class="muted">Seu histórico mais recente na Distrito 21.</p></header><section id="card" class="card hidden"><img id="photo" class="photo hidden" alt="Foto do último corte"><h2 id="hello"></h2><div id="meta" class="meta"></div><a id="again" class="btn" href="index.html">Agendar novamente</a></section><p id="msg" class="muted">Carregando...</p></main><script>
const API='https://mxrnwyxfvlxdoeksqmph.supabase.co/functions/v1/public-api';const q=new URLSearchParams(location.search);const token=q.get('token')||localStorage.getItem('d21_lastcut_token')||'';if(q.get('token'))localStorage.setItem('d21_lastcut_token',q.get('token'));const $=id=>document.getElementById(id);const fmt=d=>new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
(async()=>{if(!token){$('msg').textContent='Abra o link enviado pela Distrito 21 no seu WhatsApp para ver seu último corte.';return}try{const r=await fetch(API+'?action=last-cut&token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw 0;if(!d.last_cut){$('msg').textContent='Seu cadastro já existe, mas ainda não há um corte finalizado com foto.';return}$('hello').textContent='Olá, '+d.client.name+'!';if(d.last_cut.photo_url){$('photo').src=d.last_cut.photo_url;$('photo').classList.remove('hidden')}$('meta').innerHTML=`<div class="box"><small>Data</small><b>${fmt(d.last_cut.completed_at)}</b></div><div class="box"><small>Profissional</small><b>${d.last_cut.professional||'-'}</b></div><div class="box"><small>Serviço</small><b>${d.last_cut.service||'-'}</b></div><div class="box"><small>Barbearia</small><b>Distrito 21</b></div>`;$('again').href='index.html?pro='+encodeURIComponent(d.last_cut.professional_id||'');$('msg').classList.add('hidden');$('card').classList.remove('hidden')}catch{$('msg').textContent='Este link não é válido. Peça um novo link à Distrito 21.'}})();
</script></body></html>
